apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mini-gpay-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sumanthvartha1/mini-gpay-cicd.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
